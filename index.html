<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7faff">
  <title>Acompanhamento de solicitações de coleta</title>
  <style>
    :root {color-scheme:light;--ink:#101d35;--muted:#51617d;--blue:#0755cc;--line:#d7e3f3;--surface:#fff;--bg:#f5f8ff;--soft:#eaf3ff;--shadow:0 8px 28px rgba(30,76,147,.075)}
    * {box-sizing:border-box} body{margin:0;background:radial-gradient(ellipse at 80% 0%,#e9f2ff 0%,#f9fbff 48%,#f5f8ff 100%);font-family:Inter,Segoe UI,Arial,sans-serif;color:var(--ink)}
    .wrap{max-width:1600px;margin:0 auto;padding:28px 24px 65px}
    .header{display:flex;align-items:center;gap:22px;margin:0 0 26px;padding-left:15px}
    .header-symbol{width:56px;height:61px;display:grid;place-items:center;color:var(--blue);border-right:2px solid #98afd3;padding-right:17px;flex:0 0 74px}
    h1{font-size:clamp(25px,2.45vw,38px);letter-spacing:-1.1px;margin:0 0 6px;line-height:1.1}
    .subtitle{font-size:clamp(15px,1.3vw,19px);color:var(--muted);margin:0}
    .panel{background:rgba(255,255,255,.92);border:1px solid var(--line);border-radius:17px;box-shadow:var(--shadow)}
    .filters{display:grid;grid-template-columns:1.2fr 1.2fr 1.1fr auto;gap:22px;align-items:end;padding:20px 24px;margin-bottom:18px}
    .field{display:flex;flex-direction:column;gap:8px;min-width:0}.field label{font-size:15px;font-weight:700}
    .control{width:100%;min-height:46px;background:#fbfdff;border:1px solid #c8d7ed;border-radius:9px;padding:0 12px;color:var(--ink);font:inherit;font-size:15px;outline:none}
    .control:focus{border-color:var(--blue);box-shadow:0 0 0 3px #dceaff}
    .dates{display:flex;gap:6px;align-items:center}.dates .control{min-width:0;padding:0 9px}.dates span{color:var(--muted)}
    .actions{display:flex;gap:10px;align-items:end;white-space:nowrap}
    button{font:inherit;font-weight:650;cursor:pointer;border-radius:9px;padding:0 23px;height:46px;border:1px solid #cbd9ed;background:#f8fbff;color:var(--ink)}
    button.primary{background:#0755cc;color:#fff;border-color:#0755cc;box-shadow:0 4px 10px #0b59bf26}button:hover{filter:brightness(.97)}button:focus-visible,a:focus-visible{outline:3px solid #8bb9ff;outline-offset:2px}button:disabled{opacity:.4;cursor:not-allowed}
    .table-panel{padding:8px 10px 12px;overflow:hidden}
    .table-scroller{overflow-x:auto}table{width:100%;border-collapse:collapse;table-layout:fixed;min-width:760px;font-size:15.5px}
    col.date{width:15%}col.name{width:20%}col.area{width:16%}col.doc{width:20%}col.number{width:12%}col.tracking{width:17%}
    th{text-align:left;background:#edf3fa;padding:17px 15px;font-size:15px;font-weight:750}th:first-child{border-radius:10px 0 0 10px}th:last-child{border-radius:0 10px 10px 0}
    td{padding:15px;border-bottom:1px solid #e1e8f3;overflow-wrap:anywhere}tbody tr:hover{background:#f2f7ff}tbody tr:first-child{background:#e2efff}tbody tr:first-child td:first-child{border-radius:8px 0 0 8px}tbody tr:first-child td:last-child{border-radius:0 8px 8px 0}
    a{color:#0755cc;text-decoration:underline;text-underline-offset:2px;font-weight:600}a:hover{color:#003c9d}.external{font-size:14px;margin-left:5px}.unavailable{color:#8793a8;font-size:14px}
    .footer{display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap;padding:22px 15px 6px;color:#34466b}
    .pagination{display:flex;gap:7px;align-items:center}.pagination button{height:38px;min-width:38px;padding:0 10px}.pagination .current{background:var(--blue);color:white;border-color:var(--blue)}
    .notice{font-size:13px;color:#697a95;margin:14px 3px 0}.message{padding:30px 12px;text-align:center;color:var(--muted)}
    @media(max-width:960px){.filters{grid-template-columns:1fr 1fr;gap:15px}.actions{justify-content:flex-start}.wrap{padding:20px 14px 45px}}
    @media(max-width:570px){.header{padding-left:0;gap:12px}.header-symbol{flex-basis:50px;width:45px;padding-right:8px}.filters{grid-template-columns:1fr;padding:17px}.actions button{flex:1}.actions{width:100%}.footer{justify-content:center;text-align:center}.table-panel{padding:7px}}
  </style>
</head>
<body>
<main class="wrap">
  <header class="header">
    <div class="header-symbol" aria-hidden="true"><svg width="38" height="45" viewBox="0 0 40 48" fill="none" stroke="currentColor" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="8" width="28" height="36" rx="4"/><path d="M15 8V5c0-4 10-4 10 0v3M12 8h16v6H12zM13 29l5 5 10-11"/></svg></div>
    <div><h1>Acompanhamento de solicitações de coleta</h1><p class="subtitle">Status e rastreio das solicitações</p></div>
  </header>
  <section class="panel filters" aria-label="Filtros">
    <div class="field"><label for="inicio">Período</label><div class="dates"><input class="control" id="inicio" type="date" aria-label="Data inicial"><span>até</span><input class="control" id="fim" type="date" aria-label="Data final"></div></div>
    <div class="field"><label for="solicitante">Solicitante</label><select class="control" id="solicitante"><option value="">Todos</option></select></div>
    <div class="field"><label for="status">Status</label><select class="control" id="status"><option value="">Todos</option><option>Coleta Solicitada</option><option>Coletado</option><option>Em Trânsito</option><option>Entregue</option></select></div>
    <div class="actions"><button class="primary" type="button" id="filtrar">⌕ &nbsp;Filtrar</button><button type="button" id="limpar">↻ &nbsp;Limpar</button></div>
  </section>
  <section class="panel table-panel" aria-label="Relação de coletas">
    <div class="table-scroller"><table><colgroup><col class="date"><col class="name"><col class="area"><col class="doc"><col class="number"><col class="tracking"></colgroup><thead><tr><th>Data ↕</th><th>Solicitante</th><th>Área</th><th>Tipo de Documento</th><th>Número</th><th>Rastreio</th></tr></thead><tbody id="linhas"><tr><td colspan="6" class="message">Carregando solicitações...</td></tr></tbody></table></div>
    <footer class="footer"><span id="contagem" aria-live="polite">Carregando...</span><nav id="paginacao" class="pagination" aria-label="Paginação"></nav></footer>
  </section>
  <p class="notice" id="atualizacao" aria-live="polite"></p>
</main>
<script>
  'use strict';
  const FONTE = './dados/coletas.json';
  const POR_PAGINA = 8;
  const STATUS_VALIDOS = new Set(['Coleta Solicitada','Coletado','Em Trânsito','Entregue']);
  const $ = (id) => document.getElementById(id);
  let registros = [], filtrados = [], pagina = 1;
  const make = (tag, text, className) => {
    const el=document.createElement(tag);
    if(text !== undefined) el.textContent=String(text);
    if(className) el.className=className;
    return el;
  };
  const dataBR = iso => /^\d{4}-\d{2}-\d{2}$/.test(iso||'') ? iso.slice(8,10)+'/'+iso.slice(5,7)+'/'+iso.slice(0,4) : '—';
  function urlSegura(value) {
    if (typeof value !== 'string' || !value.trim()) return null;
    try { const url = new URL(value); return url.protocol === 'https:' ? url.href : null; }
    catch { return null; }
  }
  function render() {
    const tbody=$('linhas'); tbody.replaceChildren();
    const inicio=(pagina-1)*POR_PAGINA;
    const atual=filtrados.slice(inicio,inicio+POR_PAGINA);
    if(!atual.length){const tr=make('tr');const td=make('td','Nenhuma solicitação encontrada para os filtros selecionados.','message');td.colSpan=6;tr.append(td);tbody.append(tr)}
    atual.forEach(r=>{
      const tr=make('tr');
      [dataBR(r.data),r.solicitante||'—',r.area||'—',r.tipo_documento||'—',r.tipo_documento==='NF' ? (r.numero||'—') : 'N/A'].forEach(value=>tr.append(make('td',value)));
      const td=make('td');const url=urlSegura(r.rastreio_url);
      if(url){const a=make('a','Acessar rastreio');a.href=url;a.target='_blank';a.rel='noopener noreferrer';a.setAttribute('aria-label','Acessar rastreio de '+(r.tipo_documento==='NF'?'NF '+r.numero:'solicitação '+r.id));a.append(make('span',' ↗','external'));td.append(a)}
      else td.append(make('span','Indisponível','unavailable'));
      tr.append(td);tbody.append(tr);
    });
    $('contagem').textContent=filtrados.length ? `Exibindo ${inicio+1}–${Math.min(inicio+POR_PAGINA,filtrados.length)} de ${filtrados.length} solicitações` : 'Exibindo 0 solicitações';
    const nav=$('paginacao');nav.replaceChildren();const total=Math.ceil(filtrados.length/POR_PAGINA);
    const add=(label,pg,disabled,selected)=>{const btn=make('button',label,selected?'current':'');btn.type='button';btn.disabled=disabled;if(selected){btn.setAttribute('aria-current','page')}btn.addEventListener('click',()=>{pagina=pg;render()});nav.append(btn)};
    if(total>1){add('‹',pagina-1,pagina===1,false);for(let p=Math.max(1,pagina-2);p<=Math.min(total,Math.max(5,pagina+2));p++)add(p,p,false,p===pagina);add('›',pagina+1,pagina===total,false)}
  }
  function filtrar() {
    const di=$('inicio').value,df=$('fim').value,sol=$('solicitante').value,st=$('status').value;
    if(di&&df&&di>df){$('contagem').textContent='Data inicial posterior à data final.';return}
    filtrados=registros.filter(r=>(!di||r.data>=di)&&(!df||r.data<=df)&&(!sol||r.solicitante===sol)&&(!st||r.status===st));
    pagina=1;render();
  }
  function limpar(){ $('inicio').value='';$('fim').value='';$('solicitante').value='';$('status').value='';filtrar() }
  async function carregar(){
    try{
      const resp=await fetch(FONTE,{cache:'no-store'});
      if(!resp.ok)throw new Error('HTTP '+resp.status);
      const payload=await resp.json();
      if(!payload||!Array.isArray(payload.solicitacoes))throw new Error('Formato JSON inválido');
      registros=payload.solicitacoes.filter(r=>r&&typeof r==='object'&&typeof r.data==='string'&&typeof r.solicitante==='string'&&STATUS_VALIDOS.has(r.status)).sort((a,b)=>b.data.localeCompare(a.data)||String(a.id).localeCompare(String(b.id)));
      const nomes=[...new Set(registros.map(r=>r.solicitante))].sort((a,b)=>a.localeCompare(b,'pt-BR'));
      nomes.forEach(nome=>{const op=make('option',nome);op.value=nome;$('solicitante').append(op)});
      $('atualizacao').textContent=payload.atualizado_em?'Dados atualizados em '+new Date(payload.atualizado_em).toLocaleString('pt-BR')+'.':'';
      filtrar();
    } catch(err){$('linhas').replaceChildren();const tr=make('tr');const td=make('td','Não foi possível carregar os dados. Confirme que o site está hospedado via HTTP(S) e que dados/coletas.json existe.','message');td.colSpan=6;tr.append(td);$('linhas').append(tr);$('contagem').textContent='Erro ao carregar dados';$('atualizacao').textContent='Detalhes técnicos: '+err.message;console.error('Erro ao carregar coletas:',err)}
  }
  $('filtrar').addEventListener('click',filtrar);
  $('limpar').addEventListener('click',limpar);
  ['inicio','fim','solicitante','status'].forEach(id=>$(id).addEventListener('change',filtrar));
  carregar();
</script>
</body>
</html>
